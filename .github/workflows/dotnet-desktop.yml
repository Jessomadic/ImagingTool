name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-2025

    env:
      Solution_Name: ImagingTool.sln
      Configuration: Debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore $env:Solution_Name

      - name: Build
        run: dotnet build $env:Solution_Name --no-restore --configuration $env:Configuration

      - name: Test
        run: dotnet test $env:Solution_Name --no-build --configuration $env:Configuration --verbosity normal

      - name: Zip build output
        shell: pwsh
        run: |
          $buildDir = "bin\$env:Configuration\net9.0-windows"
          $zipPath  = "ImagingTool.zip"

          if (-not (Test-Path $buildDir)) {
            Write-Error "Build output not found: $buildDir"
            exit 1
          }

          Compress-Archive -Path "$buildDir\*" -DestinationPath $zipPath -Force
          Compress-Archive -Path "Update.ps1"  -Update -DestinationPath $zipPath
          Write-Host "Created $zipPath"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImagingTool
          path: ImagingTool.zip

      - name: Generate release tag
        id: tag
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        run: |
          $tag = "v$(Get-Date -Format 'yyyy-MM-dd-HH-mm-ss')"
          echo "tag_name=$tag" >> $env:GITHUB_OUTPUT

      - name: Create release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Build ${{ steps.tag.outputs.tag_name }}"
          prerelease: true
          files: ImagingTool.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
