name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write
  actions: write

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug]

    runs-on: windows-2025

    env:
      Solution_Name: ImagingTool.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore NuGet packages
        run: dotnet restore $env:Solution_Name

      - name: Build
        run: dotnet build $env:Solution_Name --no-restore --configuration ${{ matrix.configuration }}

      - name: Run tests
        run: dotnet test $env:Solution_Name --no-build --configuration ${{ matrix.configuration }} --verbosity normal

      - name: Zip build output
        shell: pwsh
        run: |
          $buildDir = "bin\${{ matrix.configuration }}\net9.0-windows"
          $zipPath  = "output-${{ matrix.configuration }}.zip"

          if (-not (Test-Path $buildDir)) {
            Write-Error "Build output directory not found: $buildDir"
            exit 1
          }

          Compress-Archive -Path "$buildDir\*" -DestinationPath $zipPath -Force
          Compress-Archive -Path "Update.ps1" -Update -DestinationPath $zipPath
          Write-Host "Zipped: $buildDir -> $zipPath"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-artifact-${{ matrix.configuration }}
          path: output-${{ matrix.configuration }}.zip

      - name: Create GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $tag = "v$(Get-Date -Format 'yyyy-MM-dd-HH-mm-ss')"
          echo "tag_name=$tag" >> $env:GITHUB_OUTPUT
        id: tag

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Intermediate Release ${{ steps.tag.outputs.tag_name }}"
          prerelease: true
          files: output-${{ matrix.configuration }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
