name: Upload Release Asset

on:
  workflow_run:
    workflows: [".NET Core Desktop"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish Release
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Download artifact from build workflow
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: dotnet-desktop.yml
          name: built-artifact-Debug
          run_id: ${{ github.event.workflow_run.id }}
          path: ./artifact

      - name: Generate release tag
        id: tag
        shell: pwsh
        run: |
          $tag = "v$(Get-Date -Format 'yyyy-MM-dd-HH-mm-ss')"
          echo "tag_name=$tag" >> $env:GITHUB_OUTPUT

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Intermediate Release ${{ steps.tag.outputs.tag_name }}"
          prerelease: true
          files: ./artifact/output-Debug.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
